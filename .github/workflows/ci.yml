name: ci

# Template CI: verifies the harness itself stays buildable and the
# dispatch -> dedup -> report pipeline runs end-to-end against a mock
# provider. Does NOT run live journeys (no real TEST_TARGET_URL exists
# in the template repo). Consuming projects scaffold their own CI that
# runs J4 against their actual preview URL.

on:
  pull_request:
  push:
    # Common default-branch names. Consumers should prune to match their
    # actual default. An unmatched branch is a no-op, not an error.
    branches: [master, main, develop, trunk]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Mock dispatch + dedup + report against shipped fixture
        env:
          QA_RUN_DIR: tests/fixtures/dispatch-input
          QA_MODELS: mock-a,mock-b,mock-c
        run: |
          npm run dispatch
          npm run dedup
          npm run report

      - name: Verify pipeline outputs
        run: |
          test -f tests/fixtures/dispatch-input/findings.dispatched.json
          test -f tests/fixtures/dispatch-input/findings.deduped.json
          test -f tests/fixtures/dispatch-input/REPORT.final.md
          # Style check: no em or en dashes in the rendered report.
          if grep -P "[\xe2\x80\x94\xe2\x80\x93]" tests/fixtures/dispatch-input/REPORT.final.md; then
            echo "FAIL: em or en dashes found in REPORT.final.md"
            exit 1
          fi

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-${{ github.run_id }}
          path: tests/fixtures/dispatch-input/findings*.json
          if-no-files-found: ignore
